# Inventoros local DEVELOPMENT stack (APP_DEBUG=true, bind-mounted source).
# For production use docker-compose.prod.yml and the root Dockerfile instead.
#
# One-command boot:    docker compose up --build
# With Redis cache:    docker compose --profile redis up
#
# The stack is app + worker + scheduler + PostgreSQL + Mailpit. Open
# http://localhost:8080/install afterwards: the database step is already
# filled in for the bundled PostgreSQL; its password is "inventoros" (or
# POSTGRES_PASSWORD). The web installer needs MySQL/MariaDB or PostgreSQL,
# which is why PostgreSQL is part of the default stack. Redis is opt-in.
#
# The `worker` container drains the database queue (WebhookDeliveryJob, queued
# mail, plugin jobs, etc.) and the `scheduler` container runs `schedule:run`
# every minute so scheduled commands actually fire. Without these, async work
# piles up in the `jobs`/`webhook_deliveries` tables and scheduled commands
# never run.
#
# All three PHP containers get the database settings from the environment
# below and share one APP_KEY (the entrypoint keeps it in the storage volume),
# so the worker and scheduler can read what the app encrypted, and the key
# survives `docker compose up --build`.
#
# Compose reads ${...} values from a .env file next to this file, which is
# also Laravel's own .env when you run the app without Docker. The database
# settings therefore use POSTGRES_* names, so a DB_* line meant for a local
# run (DB_CONNECTION=sqlite, DB_DATABASE=...) cannot leak into the stack.

# Shared base for the three PHP containers (app, worker, scheduler). They run
# the same image, mount the same volumes and use the same database.
x-php: &php-base
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
    args:
      PHP_VERSION: "8.4"
  image: inventoros:dev
  environment: &php-env
    APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8080}}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    MAIL_FROM_ADDRESS: dev@inventoros.local
    MAIL_FROM_NAME: Inventoros
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: ${POSTGRES_DB:-inventoros}
    DB_USERNAME: ${POSTGRES_USER:-inventoros}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-inventoros}
  volumes: &php-volumes
    # Persist storage (shared APP_KEY, uploads, logs) across container
    # restarts, shared by all three.
    - app-data:/app/database
    - app-storage:/app/storage
    # Live-reload PHP source during dev. Comment out for production-style image use.
    - ./app:/app/app
    - ./routes:/app/routes
    - ./resources:/app/resources
    - ./config:/app/config
    - ./database/migrations:/app/database/migrations
    - ./database/seeders:/app/database/seeders
    - ./database/factories:/app/database/factories
  restart: unless-stopped

services:
  app:
    <<: *php-base
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Drains the database queue. Schema is owned by `app`, so RUN_MIGRATIONS=false.
  worker:
    <<: *php-base
    environment:
      <<: *php-env
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600", "--sleep=3"]
    # No web server runs here. Without this the container inherits the
    # FrankenPHP base image's health check (Caddy's admin port) and is
    # reported unhealthy.
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Runs the Laravel scheduler once a minute (schedule:run is a single tick).
  scheduler:
    <<: *php-base
    environment:
      <<: *php-env
      RUN_MIGRATIONS: "false"
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"   # Web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025"  # SMTP
    environment:
      MP_MAX_MESSAGES: 5000
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventoros}
      POSTGRES_USER: ${POSTGRES_USER:-inventoros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventoros}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventoros} -d ${POSTGRES_DB:-inventoros}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  app-data:
  app-storage:
  postgres-data:
  redis-data:
